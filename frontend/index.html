<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludex - Gestão de Jogos</title>
  
  <!-- BOOTSTRAP 5 & ÍCONES -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <link href="/src/screens/colecao_screen.js"
  
  <!-- ESTILOS CUSTOMIZADOS (PALETA LUDEX) -->
  <style>
    :root {
      --ludex-primary: #7928ca;
      --ludex-secondary: #ff0080;
      --ludex-bg-dark: #121218;
      --ludex-card-bg: #1e1e28;
      --ludex-border: #2d2d3f;
    }

    body {
      background-color: var(--ludex-bg-dark);
      color: #e1e1e6;
    }

    /* Estilo da Navegação Lateral */
    .sidebar {
      background-color: #16161e !important;
      border-color: var(--ludex-border) !important;
    }

    .brand-title {
      background: linear-gradient(45deg, var(--ludex-primary), var(--ludex-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-pills .nav-link {
      color: #a9a9b6;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .nav-pills .nav-link.active {
      background: linear-gradient(135deg, var(--ludex-primary), #4c1d95);
      color: #fff;
      box-shadow: 0 4px 12px rgba(121, 40, 202, 0.3);
    }

    .nav-pills .nav-link:hover:not(.active) {
      background-color: var(--ludex-card-bg);
      color: #fff;
    }

    /* Estilo dos Cards e Formulário */
    .ludex-card {
      background-color: var(--ludex-card-bg);
      border: 1px solid var(--ludex-border);
      border-radius: 12px;
    }

    .btn-ludex {
      background: linear-gradient(135deg, var(--ludex-primary), #5b21b6);
      border: none;
      color: #fff;
    }

    .btn-ludex:hover {
      opacity: 0.9;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="container-fluid">
    <div class="row">

      <!-- ========================================== -->
      <!-- 1. SIDEBAR DE NAVEGAÇÃO                   -->
      <!-- ========================================== -->
      <aside class="col-md-3 col-lg-2 sidebar min-vh-100 p-3 border-end">
        <h3 class="brand-title fw-bold mb-4 d-flex align-items-center">
          <i class="bi bi-controller me-2"></i> Ludex
        </h3>

        <!-- Menu de Abas -->
        <div class="nav flex-column nav-pills" id="v-pills-tab" role="tablist">
          <button class="nav-link active text-start mb-2" id="colecao-tab" data-bs-toggle="pill" data-bs-target="#colecao">
            <i class="bi bi-collection-fill me-2"></i> Coleção
          </button>
          <button class="nav-link text-start mb-2" id="diario-tab" data-bs-toggle="pill" data-bs-target="#diario">
            <i class="bi bi-journal-bookmark-fill me-2"></i> Diário
          </button>
          <button class="nav-link text-start mb-2" id="lista-tab" data-bs-toggle="pill" data-bs-target="#lista">
            <i class="bi bi-list-check me-2"></i> Lista
          </button>
        </div>
      </aside>

      <!-- ========================================== -->
      <!-- 2. CONTEÚDO PRINCIPAL                      -->
      <!-- ========================================== -->
      <main class="col-md-9 col-lg-10 p-4">

        <!-- Formulário Rápido de Cadastro -->
        <div class="card ludex-card mb-4">
          <div class="card-body">
            <h6 class="card-title text-muted mb-3">
              <i class="bi bi-plus-circle me-1"></i> Adicionar Item à Aba Ativa
            </h6>
            <form id="formRapido" class="row g-2">
              <div class="col-md-4">
                <input type="text" id="campo1" class="form-control bg-dark border-secondary text-white" placeholder="Nome do Jogo" required>
              </div>
              <div class="col-md-3">
                <input type="text" id="campo2" class="form-control bg-dark border-secondary text-white" placeholder="Plataforma ou Data" required>
              </div>
              <div class="col-md-3">
                <input type="text" id="campo3" class="form-control bg-dark border-secondary text-white" placeholder="Nota, Texto ou Status">
              </div>
              <div class="col-md-2">
                <button type="submit" class="btn btn-ludex w-100">Adicionar</button>
              </div>
            </form>
          </div>
        </div>

        <!-- Conteúdo das Abas -->
        <div class="tab-content">

          <!-- ABA 1: COLEÇÃO -->
          <div class="tab-pane fade show active" id="colecao">
            <h4 class="fw-bold mb-3">Minha Coleção</h4>
            <div id="grid-colecao" class="row row-cols-2 row-cols-md-4 g-3"></div>
          </div>

          <!-- ABA 2: DIÁRIO -->
          <div class="tab-pane fade" id="diario">
            <h4 class="fw-bold mb-3">Diário de Bordo</h4>
            <div id="feed-diario" class="col-lg-8"></div>
          </div>

          <!-- ABA 3: LISTA -->
          <div class="tab-pane fade" id="lista">
            <h4 class="fw-bold mb-3">Minha Lista</h4>
            <div class="table-responsive">
              <table class="table table-dark table-hover align-middle rounded overflow-hidden">
                <thead>
                  <tr class="table-borderless">
                    <th>Jogo</th>
                    <th>Plataforma</th>
                    <th>Status</th>
                    <th class="text-end">Ação</th>
                  </tr>
                </thead>
                <tbody id="tabela-lista"></tbody>
              </table>
            </div>
          </div>

        </div>
      </main>

    </div>
  </div>

  <!-- BOOTSTRAP JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- MÓDULOS JAVASCRIPT -->
  <script src="colecao_screen.js"></script>
  <script src="diario_screen.js"></script>
  <script src="lista_screen.js"></script>
  <script src="app.js"></script>
</body>
</html>
>
